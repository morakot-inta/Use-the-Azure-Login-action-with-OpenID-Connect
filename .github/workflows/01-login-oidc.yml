name: 01 - Azure Login (OIDC)
run-name: Azure Login as ${{ inputs.identity }}

on:
  workflow_dispatch:
    inputs:
      identity:
        description: Which Azure identity to sign in as
        type: choice
        default: app-registration
        options:
          - app-registration
          - managed-identity

# Required for OIDC: lets the job request a GitHub ID token.
permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets[inputs.identity == 'managed-identity' && 'AZURE_MI_CLIENT_ID' || 'AZURE_CLIENT_ID'] }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Who am I?
        run: az account show --query "{subscription:name, tenant:tenantId, user:user}" -o json

      - name: Read the lab resource group
        run: az group show -n "${{ vars.AZURE_RESOURCE_GROUP }}" -o table

      - name: What can I see? (RBAC scope)
        run: az group list -o table
