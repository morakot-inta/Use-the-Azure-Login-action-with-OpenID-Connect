name: 01 - Azure Login (OIDC)

on:
  workflow_dispatch:

# Required for OIDC: lets the job request a GitHub ID token.
permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Who am I?
        run: az account show --query "{subscription:name, tenant:tenantId, user:user}" -o json

      - name: Read the lab resource group
        run: az group show -n "${{ vars.AZURE_RESOURCE_GROUP }}" -o table

      - name: What can I see? (RBAC scope)
        run: az group list -o table
